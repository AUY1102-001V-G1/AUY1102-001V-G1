# ==============================================================================
# SONARCLOUD CONFIGURATION
# ==============================================================================

# Project identification
sonar.projectKey=auy1102-001v-g1
sonar.projectName=AUY1102-001V-G1
sonar.projectVersion=1.0.0
sonar.organization=AUY1102-001V-G1

# Encoding
sonar.sourceEncoding=UTF-8

# ==============================================================================
# PATH CONFIGURATION
# ==============================================================================

# Source code location
sonar.sources=src

# Test code location
sonar.tests=test

# Exclude patterns
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

# Include patterns
sonar.inclusions=src/**/*.ts,src/**/*.js

# ==============================================================================
# COVERAGE CONFIGURATION
# ==============================================================================

# LCOV coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions
sonar.coverage.exclusions=test/**,src/**/*.test.ts,src/**/*.spec.ts

# ==============================================================================
# TYPESCRIPT CONFIGURATION
# ==============================================================================

sonar.typescript.node=true

# ==============================================================================
# SECURITY CONFIGURATION
# ==============================================================================

sonar.security.hotspots.review.rating.max=HIGH
